name: check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx prettier --check .
      - run: python3 scripts/docs_lint.py
      - run: python3 scripts/test_docs_lint.py

  # Раскатка на Cloudflare только после зелёных проверок и только с main. Почему так — docs/adr/0003-deploy-from-actions-on-main.md
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Секрета ещё нет — шаг пропускается, а не красит мерж; как завести — docs/runbooks/deploy-workers-dev.md
      - name: миграции D1 и деплой
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          npx wrangler d1 migrations apply tarotalpha --remote
          npm run deploy
      - name: проверка снаружи
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: curl --fail --silent https://tarotalpha.dksg87.workers.dev/api/health
