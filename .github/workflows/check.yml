name: check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Проверки только на PR: в main попадает только проверенная ветка — docs/architecture.md
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run build
      - run: pnpm exec prettier --check .
      - run: python3 scripts/docs_lint.py
      - run: python3 scripts/test_docs_lint.py

  # Раскатка на Cloudflare с main без повторных проверок — docs/architecture.md
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Нет секрета — шаг пропускается, а не красит мерж; как завести — docs/architecture.md
      - name: миграции D1 и деплой
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          pnpm exec wrangler d1 migrations apply tarotalpha --remote
          pnpm run deploy
      - name: проверка снаружи
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: curl --fail --silent https://tarotalpha.dksg87.workers.dev/api/health
