default_install_hook_types: [pre-commit]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^pnpm-lock\.yaml$ # lockfile pnpm — многодокументный YAML, руками не правится
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-executables-have-shebangs

  # Всё, кроме питона: его prettier не умеет и не должен (.prettierignore).
  # Версию менять только вместе с ручным прогоном, иначе вечный дифф:
  #   git ls-files -z | xargs -0 npx prettier@3.9.6 --ignore-unknown --write
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
        types_or: [ts, tsx, javascript, jsx, json, yaml, markdown, css]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  # Тот же полный аудит, что в CI, на каждом коммите — даже на коммите из одного удаления.
  # Почему не только застейдженное: docs/adr/0010-docs-lint-forgives-nothing.md
  - repo: local
    hooks:
      - id: docs-lint
        name: политика документирования
        entry: python3 scripts/docs_lint.py
        language: system
        pass_filenames: false
        always_run: true

  # Тот же ESLint и tsc, что в CI: нарушение стиля и мёртвый импорт ловятся на коммите.
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: pnpm exec eslint --max-warnings=0 --no-warn-ignored
        language: system
        types_or: [ts, tsx, javascript]
      - id: typecheck
        name: typecheck
        entry: pnpm run typecheck
        language: system
        pass_filenames: false
        always_run: false
        types_or: [ts, tsx]
